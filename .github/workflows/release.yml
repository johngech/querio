name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI (lint + typecheck + test + build)
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: ci
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure npm auth
        uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          case "$tag_version" in
            *-*) dist_tag=next ;;
          esac
          for pkg in packages/*; do
            [ ! -f "$pkg/package.json" ] && continue
            name="$(jq -r '.name' "$pkg/package.json")"
            version="$(jq -r '.version' "$pkg/package.json")"
            if [ "$pkg" = "packages/core" ] && [ "$version" != "$tag_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match @querio/core version $version; publish aborted." >&2
              exit 1
            fi
            echo "Publishing $name@$version (dist-tag: $dist_tag)"
            npm publish "$pkg" --access public --provenance --tag "$dist_tag"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}