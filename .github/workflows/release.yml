name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI (lint + typecheck + test + build)
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: ci
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run smoke-pack

      - name: Publish packages
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          dist_tag=latest
          case "$tag_version" in
            *-*) dist_tag=next ;;
          esac
          # All four packages version in lockstep (single changeset fixed group):
          # the release tag must match every published version.
          for pkg in core prisma drizzle typeorm; do
            version="$(jq -r '.version' "packages/$pkg/package.json")"
            if [ "$version" != "$tag_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match @queryjs/$pkg version $version; publish aborted." >&2
              exit 1
            fi
          done
          for pkg in core prisma drizzle typeorm; do
            echo "Publishing @queryjs/$pkg@$tag_version (dist-tag: $dist_tag)"
            ( cd "packages/$pkg" && bun publish --access public --tag "$dist_tag" )
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}